# iotrail.conf - configuracao de brokers MQTT
#
# Cada secao [nome] define um broker:
#   type - protocolo: "mqtt" (MQTT 3.1.1, suportado hoje) ou "mqtt5" (ainda
#          nao implementado - ver claude_memory/TODO.md, Fase 2). Qualquer
#          outro valor e' rejeitado com aviso e o broker e' ignorado.
#   host - IP ou hostname do broker.
#   port - porta do broker (padrao 1883, sem TLS).
#
# Multi-broker: o formato ja suporta varias secoes, mas o programa ainda so
# conecta na primeira listada - um IotrailClient por broker fica pra quando
# isso for implementado de fato (ver claude_memory/TODO.md, Fase 2).

[casa]
type=mqtt
host=192.168.0.115
port=1883
