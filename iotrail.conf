# iotrail.conf - configuracao do IoTrail
#
# Formato INI com secoes tipadas: [tipo:nome]. O tipo no cabecalho e' o que
# permite broker e stream conviverem no mesmo arquivo sem ambiguidade.
#
# Este arquivo (na raiz do projeto) e' a fonte: o build copia uma versao dele
# pro lado do .exe, e e' de la que o programa le - ele procura o iotrail.conf no
# proprio diretorio, nao no diretorio de trabalho. Editar a copia em build/ nao
# adianta, ela e' sobrescrita no build seguinte. Para apontar outro arquivo:
# iotrail -c <caminho>.
#
# Comentario so vale quando '#' ou ';' abre a linha: no meio do valor eles sao
# conteudo, porque '#' e' o wildcard multinivel do MQTT.
#
# [general]
#   Unica secao sem tipo - nao ha o que nomear. Opcional; sem ela vale o default.
#
#   data_dir - onde os segmentos sao gravados (data_dir/<stream>/...). Caminho
#          relativo resolve contra o diretorio do EXECUTAVEL, nao contra o de
#          trabalho nem contra o do -c: mover a config nao move os dados.
#          Default "data", ou seja, uma pasta data/ ao lado do .exe.
#
# [broker:nome]
#   type - protocolo. So "mqtt" (MQTT 3.1.1) e' suportado; "mqtt5" ainda nao
#          esta implementado (a lib nao expoe MQTT5 nesta rodada).
#   host - IP ou hostname do broker. Obrigatorio, sem default.
#   port - porta do broker (1883 sem TLS).
#   keepalive - segundos entre PINGREQ nesta conexao. Default 30. E' tambem o
#          tempo que a lib leva pra perceber que a conexao morreu, inclusive na
#          primeira tentativa com o broker fora do ar: keepalive 30 = ate 30 s
#          de silencio antes do primeiro aviso no log. Menor detecta mais rapido
#          e custa mais PING; 0 desliga a deteccao.
#   client_id - identidade MQTT desta conexao. Opcional; default
#          "iotrail-<nome da secao>". Vale configurar quando o broker restringe
#          por client id (ACL) ou quando duas instancias do IoTrail falam com o
#          mesmo broker - ai o default coincidiria e os dois se derrubariam.
#          Com clean_session=false o client id E' a chave da sessao: mudar o id
#          (ou renomear a secao, se estiver no default) faz o broker criar
#          sessao nova e orfanar o que estava enfileirado.
#
# [stream:nome]
#   Uma stream = uma fila = uma writer thread = uma pasta em data/ = seu proprio
#   contador de offset, comecando em 0. Nao ha offset global entre streams.
#
#   nome   - vira nome de pasta e de arquivo (data/<nome>/<nome>-00000.log).
#   broker - de qual broker esta stream recebe. Obrigatorio, e' um so. Pra
#            gravar de dois brokers, declare uma stream pra cada: o registro
#            guarda o topico, nao a origem, entao juntar brokers numa stream
#            perderia a proveniencia na gravacao, sem como recuperar depois.
#   topics - um ou mais padroes MQTT separados por virgula.
#


[general]
#data_dir=data

[broker:casa1]
type=mqtt
host=192.168.0.115
port=1883
keepalive=10

#[broker:casa2]
#type=mqtt
#host=192.168.0.115
#port=1883

[stream:temperatura]
broker=casa1
topics=temp

#[stream:umidade_sala]
